<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vitual Piano</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:whgt@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>Virtual Piano 🎹</h1>
            <p>Play using your <strong>QWERTY</strong> keyboard or click the keys!</p>
        </header>

        <div class="piano-wrapper">
            <div class="piano" id="piano">
                <div class="key white" data-key="a" data-note="C4"><span>A</span></div>
                <div class="key white" data-key="s" data-note="D4"><span>S</span></div>
                <div class="key white" data-key="d" data-note="E4"><span>D</span></div>
                <div class="key white" data-key="f" data-note="F4"><span>F</span></div>
                <div class="key white" data-key="g" data-note="G4"><span>G</span></div>
                <div class="key white" data-key="h" data-note="A4"><span>H</span></div>
                <div class="key white" data-key="j" data-note="B4"><span>J</span></div>
                <div class="key white" data-key="k" data-note="C5"><span>K</span></div>
                <div class="key white" data-key="l" data-note="D5"><span>L</span></div>
                <div class="key white" data-key=";" data-note="E5"><span>;</span></div>

                <div class="key black" data-key="w" data-note="C#4"><span>W</span></div>
                <div class="key black" data-key="e" data-note="D#4"><span>E</span></div>
                <div class="key black" data-key="t" data-note="F#4"><span>T</span></div>
                <div class="key black" data-key="y" data-note="G#4"><span>Y</span></div>
                <div class="key black" data-key="u" data-note="A#4"><span>U</span></div>
                <div class="key black" data-key="o" data-note="C#5"><span>O</span></div>
                <div class="key black" data-key="p" data-note="D#5"><span>P</span></div>

            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
